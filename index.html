<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💩 Dog Poop AI Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 12px 16px 8px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #222;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff;
    }

    #status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding: 6px 8px 0;
      font-size: 0.68rem;
    }

    .badge {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 2px 8px;
      color: #aaa;
      white-space: nowrap;
    }

    .badge span { color: #5bf; }
    .badge.good span { color: #4c4; }
    .badge.warn span { color: #fa0; }
    .badge.err  span { color: #f44; }

    #model-select {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 4px;
      color: #5bf;
      font-size: 0.68rem;
      padding: 1px 4px;
      cursor: pointer;
      outline: none;
    }

    #viewport {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin-top: 12px;
      border-radius: 12px;
      overflow: hidden;
      background: #111;
      aspect-ratio: 4/3;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #overlay-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0,0,0,0.75);
      font-size: 0.9rem;
      color: #ccc;
      text-align: center;
      padding: 20px;
    }

    #overlay-msg .icon { font-size: 2.5rem; }

    #start-btn {
      background: linear-gradient(135deg, #55bbff, #338899);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 12px 32px;
      cursor: pointer;
      margin-top: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    #start-btn:active { opacity: 0.8; }
    #start-btn:disabled { opacity: 0.5; cursor: default; }

    #det-count {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: rgba(0,0,0,0.55);
      border-radius: 8px;
      padding: 3px 10px;
      font-size: 0.75rem;
      color: #eee;
    }

    footer {
      margin: 16px 0 24px;
      font-size: 0.65rem;
      color: #444;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>💩 Dog Poop AI Detector</h1>
  <div id="status-bar">
    <div class="badge" id="b-fps">FPS <span id="v-fps">—</span></div>
    <div class="badge" id="b-backend">Backend <span id="v-backend">—</span></div>
    <div class="badge">imgsz <span>320</span></div>
    <div class="badge">
      Model
      <select id="model-select">
        <option value="v6">v6</option>
        <option value="v7" selected>v7</option>
      </select>
    </div>
    <div class="badge" id="b-model">Active <span id="v-model">—</span></div>
    <div class="badge" id="b-device">Device <span id="v-device">—</span></div>
    <div class="badge" id="b-browser">Browser <span id="v-browser">—</span></div>
  </div>
</header>

<div id="viewport">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="overlay-msg">
    <div class="icon">📷</div>
    <div id="msg-text">點擊開始，開啟相機並載入 AI 模型</div>
    <button id="start-btn">開始偵測</button>
  </div>
  <div id="det-count" style="display:none">偵測中…</div>
</div>

<footer>DogPoopAI v6/v7 · YOLOv8n · 1-class (poop)</footer>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const MODELS = {
  v6: { url: './DogPoopAI_v6_320.onnx', label: 'v6' },
  v7: { url: './DogPoopAI_v7_320.onnx', label: 'v7' },
};
let currentModelKey = 'v7';
let currentModelUrl = MODELS[currentModelKey].url;

const IMGSZ       = 320;
const CONF_THRESH = 0.30;
const NMS_IOU     = 0.45;

// ─── Display stability / anti-flicker ───────────────────────────────────────
const DEBUG_RAW_BOXES = false;   // true = show raw per-frame detections
const EMA_ALPHA       = 0.30;    // confidence smoothing
const APPEAR_THRESH   = 0.50;    // show box when smoothed confidence reaches this
const DISAPPEAR_THRESH= 0.35;    // hide box only after confidence drops below this
const BOX_SMOOTH_N    = 5;       // moving average frames for box position
const LOST_FRAMES     = 8;       // clear memory only after this many missing frames
const MEMORY_MS       = 450;     // keep last box briefly during missed detections

// ─── UI refs ─────────────────────────────────────────────────────────────────
const video     = document.getElementById('video');
const canvas    = document.getElementById('canvas');
const ctx       = canvas.getContext('2d');
const overlayEl = document.getElementById('overlay-msg');
const msgText   = document.getElementById('msg-text');
const startBtn  = document.getElementById('start-btn');
const detCount  = document.getElementById('det-count');
const modelSel  = document.getElementById('model-select');
const vFps      = document.getElementById('v-fps');
const vBackend  = document.getElementById('v-backend');
const vModel    = document.getElementById('v-model');
const vDevice   = document.getElementById('v-device');
const vBrowser  = document.getElementById('v-browser');
const bBackend  = document.getElementById('b-backend');
const bModel    = document.getElementById('b-model');
const bFps      = document.getElementById('b-fps');

// ─── Device / Browser detection ──────────────────────────────────────────────
(function detectEnv() {
  const ua = navigator.userAgent;
  let device = 'Desktop';
  if (/iPhone/.test(ua))       device = 'iPhone';
  else if (/iPad/.test(ua))    device = 'iPad';
  else if (/Android/.test(ua)) {
    const m = ua.match(/;\s*([^;)]+)\sBuild/);
    device = m ? m[1].trim() : 'Android';
  }

  let browser = 'Browser';
  if (/CriOS/.test(ua))                           browser = 'Chrome iOS';
  else if (/FxiOS/.test(ua))                      browser = 'Firefox iOS';
  else if (/EdgiOS/.test(ua))                     browser = 'Edge iOS';
  else if (/Chrome\//.test(ua))                   browser = 'Chrome';
  else if (/Firefox\//.test(ua))                  browser = 'Firefox';
  else if (/Edg\//.test(ua))                      browser = 'Edge';
  else if (/Safari\//.test(ua) && /Version\//.test(ua)) browser = 'Safari';

  vDevice.textContent  = device;
  vBrowser.textContent = browser;
})();

// ─── Load ONNX Runtime from CDN ───────────────────────────────────────────────
// v1.21.0: fixes WebGPU adapter.requestAdapterInfo → adapter.info (Chrome 121+)
const ORT_VERSION = '1.21.0';
const ORT_CDN     = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_VERSION}/dist/`;

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

// ─── Model init (WebGPU → WASM fallback) ─────────────────────────────────────
let session = null;

async function initModel() {
  setMsg('載入 ONNX Runtime…');
  if (typeof ort === 'undefined') {
    await loadScript(ORT_CDN + 'ort.all.min.js');
  }

  // Always use single-threaded WASM — avoids crossOriginIsolated requirement
  // (GitHub Pages cannot set COOP/COEP headers; multi-thread needs SharedArrayBuffer)
  ort.env.wasm.numThreads = 1;
  ort.env.wasm.wasmPaths  = ORT_CDN;

  for (const ep of ['webgpu', 'wasm']) {
    try {
      setMsg(`嘗試 ${ep.toUpperCase()} 後端…`);
      // WebGPU: check support before trying (avoids cryptic errors on unsupported browsers)
      if (ep === 'webgpu' && !navigator.gpu) {
        console.info('[webgpu] navigator.gpu not available, skipping');
        continue;
      }
      session = await ort.InferenceSession.create(currentModelUrl, {
        executionProviders: [ep],
        graphOptimizationLevel: 'all',
      });
      const label = ep.toUpperCase();
      vBackend.textContent = label;
      bBackend.className = `badge ${ep === 'webgpu' ? 'good' : 'warn'}`;
      break;
    } catch(e) {
      console.warn(`[${ep}] failed:`, e.message);
      session = null;
    }
  }

  if (!session) throw new Error('無法載入模型，請使用 Chrome 或 Safari 並允許相機權限。');

  vModel.textContent = MODELS[currentModelKey].label;
  bModel.className = 'badge good';
  console.log('[ModelLoaded]', currentModelKey, currentModelUrl);

  // Warm-up
  setMsg('模型暖機中…');
  const dummy = new ort.Tensor('float32', new Float32Array(1 * 3 * IMGSZ * IMGSZ), [1, 3, IMGSZ, IMGSZ]);
  await session.run({ images: dummy });
}

// ─── Camera ──────────────────────────────────────────────────────────────────
async function startCamera() {
  setMsg('請求相機權限…');
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false,
  });
  video.srcObject = stream;
  await new Promise(r => { video.onloadedmetadata = r; });
  await video.play();
}

// ─── Preprocessing ────────────────────────────────────────────────────────────
const offscreen = document.createElement('canvas');
offscreen.width = offscreen.height = IMGSZ;
const offCtx = offscreen.getContext('2d', { willReadFrequently: true });

function preprocess() {
  offCtx.drawImage(video, 0, 0, IMGSZ, IMGSZ);
  const { data } = offCtx.getImageData(0, 0, IMGSZ, IMGSZ);
  const n = IMGSZ * IMGSZ;
  const f = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {
    f[i]         = data[i * 4]     / 255;
    f[n + i]     = data[i * 4 + 1] / 255;
    f[2 * n + i] = data[i * 4 + 2] / 255;
  }
  return new ort.Tensor('float32', f, [1, 3, IMGSZ, IMGSZ]);
}

// ─── Postprocessing ───────────────────────────────────────────────────────────
// Output shape: [1, 5, 2100]  →  rows = x_c, y_c, w, h, conf  (coords in 0..IMGSZ)
function postprocess(tensor, vw, vh) {
  const d = tensor.data;
  const N = tensor.dims[2]; // 2100
  const raw = [];

  for (let i = 0; i < N; i++) {
    const conf = d[4 * N + i];
    if (conf < CONF_THRESH) continue;
    const xc = d[0 * N + i] / IMGSZ;
    const yc = d[1 * N + i] / IMGSZ;
    const bw = d[2 * N + i] / IMGSZ;
    const bh = d[3 * N + i] / IMGSZ;
    raw.push({
      x1: Math.max(0, xc - bw / 2),
      y1: Math.max(0, yc - bh / 2),
      x2: Math.min(1, xc + bw / 2),
      y2: Math.min(1, yc + bh / 2),
      conf,
    });
  }

  raw.sort((a, b) => b.conf - a.conf);
  const kept = [], used = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) {
    if (used[i]) continue;
    kept.push(raw[i]);
    for (let j = i + 1; j < raw.length; j++)
      if (!used[j] && iou(raw[i], raw[j]) > NMS_IOU) used[j] = 1;
  }

  return kept.map(b => ({
    x: b.x1 * vw, y: b.y1 * vh,
    w: (b.x2 - b.x1) * vw,
    h: (b.y2 - b.y1) * vh,
    conf: b.conf,
  }));
}

function iou(a, b) {
  const ix1 = Math.max(a.x1, b.x1), iy1 = Math.max(a.y1, b.y1);
  const ix2 = Math.min(a.x2, b.x2), iy2 = Math.min(a.y2, b.y2);
  const inter = Math.max(0, ix2 - ix1) * Math.max(0, iy2 - iy1);
  if (!inter) return 0;
  return inter / ((a.x2-a.x1)*(a.y2-a.y1) + (b.x2-b.x1)*(b.y2-b.y1) - inter);
}


// ─── Display transform / box smoothing ───────────────────────────────────────
function getDisplayTransform() {
  const rect = video.getBoundingClientRect();
  const displayWidth = rect.width || 320;
  const displayHeight = rect.height || 240;
  const videoWidth = video.videoWidth || 320;
  const videoHeight = video.videoHeight || 240;
  const dpr = window.devicePixelRatio || 1;

  const scale = Math.max(displayWidth / videoWidth, displayHeight / videoHeight);
  const scaledW = videoWidth * scale;
  const scaledH = videoHeight * scale;
  const offsetX = (scaledW - displayWidth) / 2;
  const offsetY = (scaledH - displayHeight) / 2;

  return { displayWidth, displayHeight, videoWidth, videoHeight, scale, offsetX, offsetY, dpr };
}

function mapVideoToDisplay(x, y, xf) {
  return [
    x * xf.scale - xf.offsetX,
    y * xf.scale - xf.offsetY,
  ];
}

function updateDisplayStability(dets) {
  const best = dets.length ? dets[0] : null;
  const rawConf = best ? best.conf : 0;

  smoothedConf = (1 - EMA_ALPHA) * smoothedConf + EMA_ALPHA * rawConf;

  if (!visible && smoothedConf >= APPEAR_THRESH) visible = true;
  if ( visible && smoothedConf <  DISAPPEAR_THRESH) visible = false;

  if (best && visible) {
    missingFrames = 0;
    boxHistory.push({
      x: best.x,
      y: best.y,
      w: best.w,
      h: best.h,
      conf: best.conf
    });
    if (boxHistory.length > BOX_SMOOTH_N) boxHistory.shift();
  } else {
    missingFrames++;
    if (missingFrames >= LOST_FRAMES) {
      boxHistory = [];
      lastSmoothBox = null;
    }
  }

  let smoothBox = null;
  if (boxHistory.length) {
    let x = 0, y = 0, w = 0, h = 0, conf = 0;
    for (const b of boxHistory) {
      x += b.x; y += b.y; w += b.w; h += b.h; conf += b.conf;
    }
    const n = boxHistory.length;
    smoothBox = { x: x/n, y: y/n, w: w/n, h: h/n, conf: conf/n };
    lastSmoothBox = smoothBox;
    lastSmoothBoxTs = performance.now();
  }

  const now = performance.now();
  const memoryActive = lastSmoothBox && (now - lastSmoothBoxTs <= MEMORY_MS);
  const displayBox = smoothBox || (memoryActive ? lastSmoothBox : null);

  return { rawConf, displayBox, memoryActive };
}

function resetDisplayStability() {
  smoothedConf = 0;
  visible = false;
  missingFrames = 0;
  boxHistory = [];
  lastSmoothBox = null;
  lastSmoothBoxTs = 0;
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function draw(dets, displayBox, xf, rawConf) {
  const { displayWidth: dw, displayHeight: dh, dpr } = xf;

  canvas.width  = Math.round(dw * dpr);
  canvas.height = Math.round(dh * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, dw, dh);

  const lw = Math.max(2, dw / 180);
  const fs = Math.max(13, dw / 26);

  function toDisplayRect(d) {
    const [x, y] = mapVideoToDisplay(d.x, d.y, xf);
    return {
      x,
      y,
      w: d.w * xf.scale,
      h: d.h * xf.scale,
      conf: d.conf
    };
  }

  // Raw detections only for debugging. Keeping them visible causes flicker.
  if (DEBUG_RAW_BOXES) {
    for (const d of dets) {
      const r = toDisplayRect(d);
      ctx.strokeStyle = 'rgba(255,80,80,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
    }
  }

  if (displayBox) {
    const r = toDisplayRect(displayBox);
    const locked = visible && smoothedConf >= APPEAR_THRESH;
    const color = locked ? '#ff3333' : 'rgba(255,170,0,0.65)';

    ctx.strokeStyle = color;
    ctx.lineWidth = locked ? lw : Math.max(1.5, lw * 0.75);
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    const label = `💩 ${(smoothedConf * 100).toFixed(0)}%`;
    ctx.font = `bold ${fs}px sans-serif`;
    const tw  = ctx.measureText(label).width;
    const pad = 4;
    const lx  = r.x;
    const ly  = r.y - fs - pad * 2 > 0 ? r.y - fs - pad * 2 : r.y + 2;

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(lx, ly, tw + pad * 2, fs + pad * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(label, lx + pad, ly + fs + pad * 0.6);
  }
}

// ─── Inference loop ───────────────────────────────────────────────────────────
let running = false, frameCount = 0, lastTs = performance.now();

let smoothedConf = 0;
let visible = false;
let missingFrames = 0;
let boxHistory = [];
let lastSmoothBox = null;
let lastSmoothBoxTs = 0;

async function inferLoop() {
  if (!running) return;

  const t = preprocess();
  const out = await session.run({ images: t });
  const outTensor = out[Object.keys(out)[0]];

  const vw = video.videoWidth  || 320;
  const vh = video.videoHeight || 240;
  const dets = postprocess(outTensor, vw, vh);
  const xf = getDisplayTransform();
  const { rawConf, displayBox } = updateDisplayStability(dets);
  draw(dets, displayBox, xf, rawConf);

  frameCount++;
  const now = performance.now();
  if (now - lastTs >= 1000) {
    const fps = Math.round(frameCount * 1000 / (now - lastTs));
    vFps.textContent = fps;
    bFps.className = `badge ${fps >= 15 ? 'good' : fps >= 7 ? 'warn' : 'err'}`;
    frameCount = 0; lastTs = now;
  }

  detCount.textContent = displayBox
    ? `💩 目標穩定中 ${(smoothedConf * 100).toFixed(0)}%`
    : '未偵測到便便';

  requestAnimationFrame(inferLoop);
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function setMsg(t) { msgText.textContent = t; }

// ─── Model switching ─────────────────────────────────────────────────────────
async function loadSelectedModel() {
  if (!running) {
    currentModelKey = modelSel.value;
    currentModelUrl = MODELS[currentModelKey].url;
    vModel.textContent = MODELS[currentModelKey].label;
    return;
  }

  running = false;
  resetDisplayStability();
  modelSel.disabled = true;
  setMsg(`切換模型到 ${MODELS[modelSel.value].label}...`);

  currentModelKey = modelSel.value;
  currentModelUrl = MODELS[currentModelKey].url;

  try {
    if (session && typeof session.release === 'function') {
      await session.release();
    }
  } catch (e) {
    console.warn('[ModelSwitch] session release warning:', e);
  }

  session = null;

  try {
    await initModel();
    overlayEl.style.display = 'none';
    detCount.style.display = 'block';
    running = true;
    console.log('[ModelSwitch]', currentModelKey, currentModelUrl);
    inferLoop();
  } catch (e) {
    console.error(e);
    setMsg(`❌ 模型切換失敗: ${e.message}`);
    vModel.textContent = 'error';
    bModel.className = 'badge err';
    startBtn.disabled = false;
    startBtn.textContent = '重試';
  } finally {
    modelSel.disabled = false;
  }
}

modelSel.addEventListener('change', loadSelectedModel);

// ─── Start ────────────────────────────────────────────────────────────────────
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = '載入中…';
  try {
    currentModelKey = modelSel.value;
    currentModelUrl = MODELS[currentModelKey].url;
    await startCamera();
    await initModel();
    overlayEl.style.display = 'none';
    detCount.style.display  = 'block';
    resetDisplayStability();
    running = true;
    inferLoop();
  } catch (e) {
    console.error(e);
    setMsg(`❌ ${e.message}`);
    vModel.textContent = 'error';
    bModel.className = 'badge err';
    startBtn.disabled = false;
    startBtn.textContent = '重試';
  }
});
</script>
</body>
</html>
